[project]
name = "localflow"
version = "0.1.0"
description = "LocalFlow backend: a locally-running AI filmmaking studio (API + GPU worker)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "huggingface-hub>=1.33.0",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "litellm>=1.104.2",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
localflow = "localflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["localflow"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008", "RUF012"]

[tool.mypy]
python_version = "3.12"
packages = ["localflow"]
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["gpu: requires a real GPU and installed models (skipped by default)"]
addopts = "-m 'not gpu'"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
# Real inference (engine = "real"). Installed by default; skip with `uv sync --no-group gpu`.
gpu = [
    "torch>=2.14.1",
    "diffusers>=0.41.0",
    "transformers>=5.19.0",
    "accelerate>=1.15.0",
    "gguf>=0.19.0",
    "peft>=0.21.2",
    "sentencepiece>=0.2.2",
    "protobuf>=6.30.0",
    "safetensors>=0.8.0",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]  # CUDA 13 wheels (RTX 50-series / sm_120 needs CUDA >= 12.8)

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
