    steps: 40
    guidance_scale: 5.0
    sizes:
      quality: {"16:9": [1280, 720], "9:16": [720, 1280], "1:1": [960, 960]}
      balanced: {"16:9": [832, 480], "9:16": [480, 832], "1:1": [640, 640]}
      low: {"16:9": [832, 480], "9:16": [480, 832], "1:1": [640, 640]}
  render: {max_clip_seconds: 5.0, fps: 16, supported_modes: [flf2v], supports_native_audio: false}
  vram_profiles: {resident_gb: 15.0}
  parts:
    - role: transformer
      repo_id: city96/Wan2.1-FLF2V-14B-720P-gguf
      allow_patterns: [wan2.1-flf2v-14b-720p-Q4_K_M.gguf]
    - role: text
      repo_id: Wan-AI/Wan2.2-TI2V-5B-Diffusers
      allow_patterns: [text_encoder/*, tokenizer/*]
    - role: base
      repo_id: Wan-AI/Wan2.1-FLF2V-14B-720P-diffusers
