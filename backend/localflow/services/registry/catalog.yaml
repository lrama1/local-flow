- key: kokoro-82m
  name: Kokoro-82M
  purpose: Text-to-speech
  description: Fast, small multi-voice TTS. Its weights are only published as PyTorch pickles.
  kind: audio
  capabilities: [tts]
  adapter_key: kokoro
  base_model: kokoro
  source_ref: hexgrad/Kokoro-82M
  license: Apache 2.0
  license_url: https://huggingface.co/hexgrad/Kokoro-82M
  approx_size_gb: 0.36
  recommended: true
  requires_pickle: true
  notes: Requires allow_pickle_weights = true; loaded with torch.load(weights_only=True).
  parts:
    - role: base
      repo_id: hexgrad/Kokoro-82M
      allow_patterns: [config.json, kokoro-v1_0.pth, voices/*.pt]

- key: mmaudio-large-44k-v2
  name: MMAudio large 44.1 kHz v2
  purpose: Video-to-audio SFX
  description: Generates synchronized sound effects for a video clip. Weights are PyTorch pickles.
  kind: audio
  capabilities: [v2a]
  adapter_key: mmaudio
  base_model: mmaudio
  source_ref: hkchengrex/MMAudio
  license: CC BY-NC 4.0 (weights); CLIP apple-amlr; BigVGAN MIT
  license_url: https://huggingface.co/hkchengrex/MMAudio
  approx_size_gb: 10.7
  requires_pickle: true
  notes: >-
    Requires allow_pickle_weights = true (all parts are loaded with torch.load(weights_only=True)).
    Includes the CLIP image/text encoder and BigVGAN vocoder MMAudio needs, so nothing downloads at run
    time. Uses about 6 GB of VRAM.
  parts:
    - role: base
      repo_id: hkchengrex/MMAudio
      allow_patterns:
        [weights/mmaudio_large_44k_v2.pth, ext_weights/synchformer_state_dict.pth, ext_weights/v1-44.pth]
    - role: clip
      repo_id: apple/DFN5B-CLIP-ViT-H-14-384
      allow_patterns: [open_clip_config.json, open_clip_pytorch_model.bin]
    - role: vocoder
      repo_id: nvidia/bigvgan_v2_44khz_128band_512x
      allow_patterns: [config.json, bigvgan_generator.pt]

